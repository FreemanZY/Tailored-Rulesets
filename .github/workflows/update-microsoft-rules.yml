name: Update Microsoft rules

on:
  schedule:
    - cron: "17 11 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-microsoft-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh official Microsoft endpoint data
        run: python scripts/update_microsoft_rules.py

      - name: Run deterministic and repository checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_microsoft_rules.py --check

      - name: Commit changed generated files
        shell: bash
        run: |
          git add -- \
            dist/microsoft_generated_domainset.txt \
            dist/microsoft_generated_ruleset.txt \
            sources/microsoft_endpoints.json
          if git diff --cached --quiet; then
            echo "Microsoft generated files are unchanged."
            exit 0
          fi
          versions="$(python -c 'import hashlib,json; d=json.load(open("sources/microsoft_endpoints.json", encoding="utf-8")); parts=["{}={}".format(k, d["instances"][k]["version"]) for k in ("Worldwide", "China", "USGovDoD", "USGovGCCHigh")]; parts.append("PowerApps={}".format(d["power_apps"]["semantic_hash"][:12])); supplemental=hashlib.sha256("".join(d["supplemental_sources"][k]["semantic_hash"] for k in sorted(d["supplemental_sources"])).encode("ascii")).hexdigest()[:12]; parts.append("Supplemental={}".format(supplemental)); print(", ".join(parts))')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): update Microsoft endpoints" -m "$versions"
          git push
