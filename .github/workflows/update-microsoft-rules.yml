name: Update Microsoft 365 rules

on:
  schedule:
    - cron: "32 15 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-microsoft-365-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh Microsoft endpoint data
        run: python scripts/update_microsoft_rules.py

      - name: Run deterministic and repository checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/update_microsoft_rules.py --check

      - name: Commit changed generated files
        shell: bash
        run: |
          git add -- \
            dist/microsoft_generated_domainset.txt \
            dist/microsoft_generated_ruleset.txt \
            sources/microsoft_endpoints.json
          if git diff --cached --quiet; then
            echo "Microsoft generated files are unchanged."
            exit 0
          fi
          versions="$(python -c 'import json; d=json.load(open("sources/microsoft_endpoints.json", encoding="utf-8")); print(", ".join("{}={}".format(k, d["instances"][k]["version"]) for k in ("Worldwide", "China", "USGovDoD", "USGovGCCHigh")))')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): update Microsoft 365 endpoints" -m "$versions"
          git push
